name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential fakeroot rsync curl perl zip unzip xz-utils git file

      - name: 可选依赖（缺了也能编）
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-dev libtinfo6 || true
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          sudo ldconfig || true

      - name: 安装 ldid（Theos 签名必需）
        run: |
          curl -fsSL -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          ldid -h 2>&1 | head -2 || true

      - name: 安装 Theos 与 iOS 工具链
        run: |
          set -e
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          cd "$HOME/theos"
          git submodule update --init --recursive --depth 1 || true
          if [ ! -f "$HOME/theos/vendor/dm.pl/dm.pl" ]; then
            echo "补 dm.pl"
            rm -rf "$HOME/theos/vendor/dm.pl"
            git clone --depth 1 https://github.com/theos/dm.pl.git "$HOME/theos/vendor/dm.pl"
          fi
          ls "$HOME/theos/vendor/dm.pl/dm.pl"
          mkdir -p "$HOME/theos/toolchain"
          ARCH=$(uname -m)
          echo "arch=$ARCH"
          curl -sL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-$ARCH.tar.xz" -o /tmp/tc.tar.xz
          ls -l /tmp/tc.tar.xz
          tar -xJf /tmp/tc.tar.xz -C "$HOME/theos/toolchain/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          ls "$HOME/theos/toolchain/linux/iphone/bin"
          "$HOME/theos/toolchain/linux/iphone/bin/clang" --version | head -3

      - name: 安装 iOS SDK
        run: |
          set -e
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$HOME/theos/sdks"
          SDK=$(ls -d /tmp/sdks/iPhoneOS*.sdk 2>/dev/null | sort -V | tail -1)
          if [ -z "$SDK" ]; then echo "没找到 SDK"; exit 1; fi
          echo "使用 $SDK"
          cp -R "$SDK" "$HOME/theos/sdks/"
          ls "$HOME/theos/sdks"

      - name: 可选 —— 拉 SILK SDK（失败不影响编译）
        continue-on-error: true
        run: |
          if [ -d vendor/silk/src ]; then echo "vendor/silk 已存在，跳过"; exit 0; fi
          git clone --depth 1 https://github.com/kn007/silk-v3-decoder.git /tmp/silk
          mkdir -p vendor
          cp -R /tmp/silk/silk vendor/silk
          rm -f vendor/silk/src/*.S

      - name: 编译
        run: make package FINALPACKAGE=1

      - name: 收集产物
        if: always()
        run: |
          mkdir -p artifacts
          cp -v packages/*.deb artifacts/ 2>/dev/null || true
          # 注意：dSYM 目录里也有一个叫 DTKiller.dylib 的调试符号文件（Mach-O type 10），
          # find 会把两个同名文件拷进 artifacts/，后者覆盖前者 —— 上次就是这样把 dSYM
          # 当成品发出去的，TrollFools 签名时报 "ldid: Unsupported Mach-O type"。
          DL=$(find .theos -name "DTKiller.dylib" -not -path "*dSYM*" | head -1)
          if [ -n "$DL" ]; then cp -v "$DL" artifacts/; else echo "!! 没找到真正的 dylib"; fi
          for f in artifacts/*.dylib; do
            [ -e "$f" ] || continue
            printf "%s 文件头: " "$f"; od -An -tx1 -N8 "$f"
          done
          ls -l artifacts || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DTKiller
          path: artifacts/*
          if-no-files-found: warn

      - name: 失败时打印诊断
        if: failure()
        run: |
          echo "=== clang ==="
          clang --version | head -2 || true
          echo "=== theos clang ==="
          ls -l "$HOME/theos/toolchain/linux/iphone/bin" 2>/dev/null | head || true
          echo "=== THEOS ==="
          echo "$THEOS"
          ls "$THEOS" 2>/dev/null | head || true
          ls "$THEOS/sdks" 2>/dev/null || true
